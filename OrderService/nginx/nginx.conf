events { }

http {
    upstream backend {
        server orderservice:8080;
    }

    # =========================
    # HTTP → HTTPS redirect
    # =========================
    server {
        listen 80;
        server_name orderb.hopto.org;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # HTTPS SERVER
    # =========================
    server {
        listen 443 ssl;
        server_name orderb.hopto.org;

        ssl_certificate     /etc/letsencrypt/live/orderb.hopto.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orderb.hopto.org/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # =========================
        # MAIN PROXY
        # =========================
        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets support (CRITICAL for SignalR)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Stability for SignalR / LongPolling fallback
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}